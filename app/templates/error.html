{% extends "base.html" %}
{% block title %}{{ title }} — PetMatch{% endblock %}
{% block content %}
<div class="empty" style="max-width:520px;margin:var(--space-8) auto">
  <div class="empty__icon">{% if code == 404 %}🔍{% elif code == 403 %}🔒{% else %}🐾{% endif %}</div>
  <h3>{{ title }}</h3>
  <p>{{ message }}</p>
  <a class="btn btn--primary" href="{{ url_for('home.index') }}">Back to home</a>
</div>
{% endblock %}

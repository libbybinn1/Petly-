{% extends "base.html" %}
{% block title %}Create an account — PetMatch{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-card__lead">Tell us about your home and we will suggest animals that fit it.</p>

    <form method="post" action="{{ url_for('auth.register') }}">
      <div class="field">
        <label class="field__label" for="full_name">Full name</label>
        <input class="input" type="text" id="full_name" name="full_name"
               value="{{ full_name or '' }}" required autocomplete="name" autofocus>
      </div>
      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email"
               value="{{ email or '' }}" required autocomplete="email">
      </div>
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password"
               required minlength="8" autocomplete="new-password">
        <span class="field__hint">At least 8 characters.</span>
      </div>
      <div class="field">
        <label class="field__label" for="confirm_password">Confirm password</label>
        <input class="input" type="password" id="confirm_password" name="confirm_password"
               required minlength="8" autocomplete="new-password">
      </div>
      <button class="btn btn--primary btn--block" type="submit">Create account</button>
    </form>

    <div class="auth-card__footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
